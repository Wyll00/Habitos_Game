# Blueprint para desplegar en Render (https://render.com).
# Render lee este archivo y crea el servicio automáticamente.
services:
  - type: web
    name: habitos-game
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        sync: false          # lo pegas tú a mano en el panel (es secreto)
      - key: FLASK_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true   # Render genera una cadena aleatoria segura
      - key: APP_PASSWORD
        sync: false           # la pones tú a mano en el panel (tu contraseña)
      - key: PYTHON_VERSION
        value: "3.11.9"
